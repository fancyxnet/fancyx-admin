syntax = "proto3";

package fancyx.internal.grpc.system;
option csharp_namespace = "Fancyx.Internal.Grpc.System";

message GetUserPermissionReq{
	int64 user_id = 1;
}

message GetUserPermissionRes{
	repeated string auths = 1;
}

message ExistTenantReq{
	string tenant_id = 1;
}

message ExistTenantRes{
	bool is_exist = 1;
}